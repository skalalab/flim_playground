num_channels = 3
unique_cell_id_col = "cell_id"
available_feature_types = [ "Lifetime_Fit", "Lifetime_FitFree", "Intensity",]
available_input_types = [ "ROI Summing Fit", "SPCImage", "K-Flow",]

[channel_names]
ch1 = "nadh"
ch2 = "fad"
ch3 = "red"

[feature_types]
ch1 = [ "Lifetime_Fit", "Lifetime_FitFree", "Intensity",]
ch2 = [ "Lifetime_Fit", "Lifetime_FitFree", "Intensity",]
ch3 = [ "Intensity",]

[spc_output_suffix]
a1 = "_a1[%].asc"
a2 = "_a2[%].asc"
t1 = "_t1.asc"
t2 = "_t2.asc"
a3 = "_a3[%].asc"
t3 = "_t3.asc"

[required_file_types.Lifetime_Fit]
"ROI Summing Fit" = [ "Mask", "IRF", "Decay",]
SPCImage = [ "Mask", "Decay", "a1",]
K-Flow = [ "IRF", "Histogram",]

[required_file_types.Lifetime_FitFree]
