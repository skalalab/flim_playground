image_name_col = "image_name"
available_input_types = [ "ROI Summing Fit", "SPCImage", "K-Flow",]
num_channels = 2
unique_cell_id_col = "cell_id"
preferred_input_type = "ROI Summing Fit"

[channel_names]
ch1 = "nadh"
ch2 = "fad"
ch3 = "red"

[available_feature_extractors]
Lifetime = [ "fit", "fit free",]
Intensity = [ "morphology", "texture",]

available_file_types = ["Mask", "Decay", "IRF", "Histogram", "a1"]


[spc_output_suffix]
a1 = "_a1[%].asc"
t1 = "_t1.asc"
a2 = "_a2[%].asc"
t2 = "_t2.asc"
a3 = "_a3[%].asc"
t3 = "_t3.asc"

[num_components]
nadh = 2
fad = 2
red = 0

[feature_extractors.nadh]
Lifetime = [ "fit free", "fit",]
Intensity = [ "morphology", "texture",]

[feature_extractors.fad]
Lifetime = [ "fit", "fit free",]
Intensity = [ "texture", "morphology",]

[feature_extractors.red]
Intensity = [ "morphology", "texture",]

[inputSuffixes.nadh."ROI Summing Fit"]
Mask = "n_photons_mask_cyto.tiff"
Decay = "n.sdt"
IRF = "NADH_IRF.txt"

[inputSuffixes.nadh.SPCImage]
a1 = "n.uncompressed_a1[%].asc"
Mask = "n_photons_mask_cyto.tiff"
Decay = "n.sdt"
IRF = "NADH_IRF.txt"

[inputSuffixes.nadh.K-Flow]
Histogram = "_ch1.csv"
IRF = "NADH_IRF.txt"

[inputSuffixes.fad."ROI Summing Fit"]
Mask = "n_photons_mask_cyto.tiff"
Decay = "f.sdt"
IRF = "FAD_IRF.txt"

[inputSuffixes.fad.SPCImage]
a1 = "f.uncompressed_a1[%].asc"
Mask = "n_photons_mask_cyto.tiff"
Decay = "f.sdt"
IRF = "FAD_IRF.txt"

[inputSuffixes.fad.K-Flow]
Histogram = "_ch2.csv"
IRF = "FAD_IRF.txt"

[inputSuffixes.red."ROI Summing Fit"]
Mask = "n_photons_mask_cyto.tiff"
Decay = "r.sdt"

[inputSuffixes.red.SPCImage]
Mask = "n_photons_mask_cyto.tiff"
Decay = "r.sdt"

[inputSuffixes.red.K-Flow]
