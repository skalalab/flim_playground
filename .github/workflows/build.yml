name: Build executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        # A dispatch build's version is now VISIBLE in the app's nav bar, and a
        # dispatch artifact has been release-uploaded before (the 1.10.3 Intel
        # mac backfill). Name the version here when doing that, or the app will
        # display 0.0.0-dev on what users see as a real release.
        description: 'Version to stamp (blank = 0.0.0-dev)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # APP_VERSION at job level so BOTH the PyInstaller build step (which embeds
    # it in the Windows .exe version resource via the spec) and the Inno Setup
    # staging step read the same value. Release builds get the tag (e.g.
    # 1.11.0); manual workflow_dispatch builds fall back to the dev placeholder.
    env:
      APP_VERSION: ${{ github.event.release.tag_name || inputs.version || '0.0.0-dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          # Last GitHub-hosted Intel mac image (macos-13 retired Dec 2025);
          # available until macOS 15 leaves support in Aug 2027.
          - os: macos-15-intel
            name: macos-x64
          - os: ubuntu-24.04
            name: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Build with PyInstaller
        run: uv run pyinstaller Flim-Playground.spec --clean

      # All three platforms ship onedir builds (fast startup, no per-launch
      # self-extraction). macOS and Linux are tarred so the executable bit
      # survives download (zip strips it): macOS wraps the onedir in
      # Flim-Playground.app, Linux ships the Flim-Playground/ folder. Windows
      # wraps the onedir folder in a single per-user installer via Inno Setup
      # (Flim-Playground-Setup.exe): the user downloads one file, it installs
      # once and adds shortcuts, then every launch is full onedir speed.
      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Both mac jobs (Apple Silicon + Intel) attach to the same release,
            # so the tar name must encode the arch: arm64 keeps the historical
            # unsuffixed name existing links point at, Intel gets -intel.
            if [ "$(uname -m)" = "x86_64" ]; then MAC_SUFFIX="-intel"; else MAC_SUFFIX=""; fi
            tar -czf "release/Flim-Playground-mac${MAC_SUFFIX}.tar.gz" -C dist Flim-Playground.app
          elif [ "$RUNNER_OS" = "Linux" ]; then
            # Desktop integration so Linux users get a clickable, iconed launcher
            # like macOS/Windows instead of a bare binary. Drop a square PNG icon
            # (padded from logo.png, same idea as the Windows .ico) plus
            # install.sh/uninstall.sh INSIDE the onedir folder; the user runs
            # ./install.sh once to register a "FLIM Playground" menu entry.
            uv run python -c "from PIL import Image; im = Image.open('logo.png').convert('RGBA'); side = max(im.size); sq = Image.new('RGBA', (side, side), (0, 0, 0, 0)); sq.paste(im, ((side - im.width) // 2, (side - im.height) // 2)); sq.resize((256, 256)).save('dist/Flim-Playground/flim-playground.png')"
            cp linux/install.sh linux/uninstall.sh dist/Flim-Playground/
            chmod +x dist/Flim-Playground/install.sh dist/Flim-Playground/uninstall.sh
            # Tar the onedir CONTENTS (not the folder itself) so double-clicking
            # the archive in a file manager yields a single Flim-Playground-linux/
            # folder with install.sh right inside. Taring the folder made managers
            # wrap it twice (Flim-Playground-linux/Flim-Playground/). Extracted
            # from inside the onedir dir to keep exec bits (zip strips them). A raw
            # `tar xzf` spills into the cwd — the README shows --one-top-level.
            tar -czf release/Flim-Playground-linux.tar.gz -C dist/Flim-Playground .
          else
            # Brand the Setup exe: build logo.ico from logo.png (padded to a
            # transparent square so the 320x207 logo isn't squished into the
            # square icon slots). Kept out of the repo — logo.png is the source.
            uv run python -c "from PIL import Image; im = Image.open('logo.png').convert('RGBA'); side = max(im.size); sq = Image.new('RGBA', (side, side), (0, 0, 0, 0)); sq.paste(im, ((side - im.width) // 2, (side - im.height) // 2)); sq.save('logo.ico', sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])"
            # Inno Setup is usually pre-installed on windows-latest; install via
            # choco as a fallback so the build doesn't depend on the runner image.
            ISCC=$(find "/c/Program Files (x86)" -maxdepth 2 -name ISCC.exe 2>/dev/null | head -1)
            if [ -z "$ISCC" ]; then
              choco install innosetup --no-progress -y
              ISCC=$(find "/c/Program Files (x86)" -maxdepth 2 -name ISCC.exe 2>/dev/null | head -1)
            fi
            "$ISCC" Flim-Playground.iss
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flim-Playground-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: github.event_name == 'release' || inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name || inputs.version }}' release/* --clobber

  # The release tag is authoritative. This job synchronizes the default
  # branch's release metadata after publication, while remaining independent
  # of the build matrix so metadata changes cannot block release binaries.
  # uv lock owns generated lockfile content; the shell rewrite edits only the
  # version-bearing fields in pyproject.toml and CITATION.cff.
  sync-release-metadata:
    name: Sync release metadata to the release tag
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    env:
      BRANCH: ${{ github.event.repository.default_branch || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch, not the tag: this job commits, and a tag checkout is
          # detached. Full history because pushing from a shallow clone can be
          # refused with "shallow update not allowed".
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Synchronize release metadata, then push
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          PUBLISHED: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          version="${TAG#v}"           # tags here are bare 1.12.0; be safe anyway
          released="${PUBLISHED%%T*}"  # 2026-09-04T20:15:53Z -> 2026-09-04, UTC
          # Restrict the TOML rewrite to the [project] table. The citation
          # patterns are anchored at column 0, so nested preferred-citation
          # fields remain untouched.
          sed -e "/^\[project\]$/,/^\[/ s|^version = \".*\"\$|version = \"${version}\"|" \
              pyproject.toml > pyproject.toml.tmp
          mv pyproject.toml.tmp pyproject.toml
          sed -e "s|^version: \".*\"\$|version: \"${version}\"|" \
              -e "s|^date-released: \".*\"\$|date-released: \"${released}\"|" \
              CITATION.cff > CITATION.cff.tmp
          mv CITATION.cff.tmp CITATION.cff
          uv lock
          uv lock --check
          VERSION="$version" python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          expected = os.environ["VERSION"]
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_metadata = project.get("project", {})
          runtime_requirements = project_metadata.get("dependencies")
          if not runtime_requirements:
              raise SystemExit(
                  "pyproject.toml has no [project].dependencies; refusing to publish an incomplete lockfile"
              )
          if "requires-python" not in project_metadata:
              raise SystemExit(
                  "pyproject.toml has no [project].requires-python; refusing to publish an incomplete lockfile"
              )

          expected_names = {
              re.split(r"[<>=!~;\[]", requirement, maxsplit=1)[0]
              .strip()
              .lower()
              .replace("_", "-")
              for requirement in runtime_requirements
          }
          lock = Path("uv.lock").read_text(encoding="utf-8")
          lock_data = tomllib.loads(lock)
          roots = [package for package in lock_data.get("package", []) if package.get("name") == "flim-playground"]
          if len(roots) != 1:
              raise SystemExit(
                  f"expected one flim-playground package entry in uv.lock, found {len(roots)}"
              )
          root = roots[0]
          if root.get("version") != expected:
              raise SystemExit(
                  f"uv.lock has flim-playground {root.get('version')}, expected {expected}"
              )
          locked_names = {dependency["name"] for dependency in root.get("dependencies", [])}
          missing = sorted(expected_names - locked_names)
          if missing:
              raise SystemExit(
                  "uv.lock is missing runtime dependencies: " + ", ".join(missing)
              )
          PY
          if git diff --quiet -- pyproject.toml uv.lock CITATION.cff; then
            echo "release metadata already reads ${version} -- nothing to sync."
            exit 0
          fi
          git diff -- pyproject.toml uv.lock CITATION.cff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock CITATION.cff
          git commit -m "sync release metadata to ${version}" -- pyproject.toml uv.lock CITATION.cff
          # Rebase first: releases are published from the web UI, so the branch
          # may have moved since. A GITHUB_TOKEN push starts no workflow run,
          # and this workflow has no push trigger either, so there is no loop.
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"
