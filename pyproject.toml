    "jinja2==3.1.6",
    "joblib==1.4.2",
    "kiwisolver==1.4.8",
    "llvmlite==0.44.0",
    "lmfit>=1.3.3",
    "markupsafe==3.0.2",
    "matplotlib==3.10.1",
    "numba==0.61.2",
    "numpy==2.2.4",
    "packaging==24.2",
    "pandas==2.2.3",
