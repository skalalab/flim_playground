current_profile = "iris"

[profiles.wine]
unique_row_id_col = "wine_id"
fov_name_col = ""
categorical_cols = [ "quality",]
all_numerical_features = [ "fixed_acidity", "volatile_acidity", "citric_acid", "residual_sugar", "chlorides", "free_sulfur_dioxide", "total_sulfur_dioxide", "density", "pH", "sulphates", "alcohol",]

[profiles.iris]
unique_row_id_col = "flower_id"
fov_name_col = ""
categorical_cols = [ "species",]
all_numerical_features = [ "sepal_length", "sepal_width", "petal_length", "petal_width",]

[profiles.wine.feature_groups]
SO2 = [ "free_sulfur_dioxide", "total_sulfur_dioxide",]
acidity = [ "fixed_acidity", "citric_acid", "pH", "volatile_acidity",]
Sugar = [ "residual_sugar", "alcohol",]

[profiles.iris.feature_groups]
sepal = [ "sepal_width", "sepal_length",]
petal = [ "petal_width", "petal_length",]
